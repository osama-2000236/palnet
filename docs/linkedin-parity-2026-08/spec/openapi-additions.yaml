# spec/openapi-additions.yaml
#
# The 188 new routes and 16 changed ones, as an OpenAPI 3.1 skeleton.
#
# This is NOT a hand-maintained artefact and it is NOT the source of truth.
# The API is NestJS + @nestjs/swagger, so the real document is generated from
# the decorators at /api/docs. This file exists for ONE purpose: to let you
# diff what you built against what was specified, per phase, without reading
# prose. When they disagree, the master spec section named in `x-spec` wins.
#
# Response schemas are deliberately omitted. They come from the Zod contracts
# in @baydar/shared via nestjs-zod, and duplicating them here would create a
# second source of truth that drifts — which is the exact failure mode this
# repo's five bespoke gates exist to prevent.
#
# Every path below must also appear in EXPECTED_ROUTES in
# apps/api/src/modules/api-route-coverage.spec.ts. Paths marked
# x-public: true must ALSO appear in EXPECTED_PUBLIC_ROUTES with a comment.

openapi: 3.1.0
info:
  title: Baydar API — LinkedIn-parity additions
  version: "2026.08-parity"
  description: >-
    Additions to the existing 137-route surface. Base path /api/v1.
servers:
  - url: https://api.baydar.ps/api/v1
    description: production

tags:
  - name: WS-01
    description: Identity, evidence and the trust spine
  - name: WS-02
    description: "The graph: follow, degree, discovery"
  - name: WS-03
    description: "Content: mentions, polls, articles, newsletters"
  - name: WS-04
    description: The ranked feed engine
  - name: WS-05
    description: Groups and events
  - name: WS-06
    description: Hiring end to end
  - name: WS-07
    description: Services and the freelance economy
  - name: WS-08
    description: Learning
  - name: WS-09
    description: Payments, pricing and monetisation
  - name: WS-10
    description: Messaging
  - name: WS-12
    description: Trust, safety and the scam economy
  - name: WS-13
    description: Search and relevance
  - name: WS-14
    description: Notifications, digests and SMS

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
      description: INTERNAL_CRON_TOKEN. Enforced by InternalTokenGuard.
    providerSignature:
      type: apiKey
      in: header
      name: x-provider-signature
      description: >-
        Wallet callback signature. Verified against the provider's webhook
        secret before the body is parsed. A callback route cannot carry a
        session, which is why it is public.
  responses:
    DomainError:
      description: >-
        Baydar DomainException envelope. Every error carries a named code and
        an actionable details payload — an error the user cannot act on is a bug.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, example: DOMAIN_NOT_ELIGIBLE }
              message: { type: string }
              details: { type: object, additionalProperties: true }
    RateLimited:
      description: RATE_LIMITED. Bucket named in x-rate-bucket.

