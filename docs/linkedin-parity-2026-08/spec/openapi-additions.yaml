# ── CHANGED ROUTES ─────────────────────────────────────────────────────────
# Existing paths whose request or response shape changes. Listed as comments
# rather than path entries so this file never looks like it redefines them.
#
#  GET    /feed
#         phase P1,P5 · WS-04/WS-11
#         ?sort=ranked|recent&offset= ; slate-based paging replaces the cursor; authors-map response shape
#  POST   /posts
#         phase P4 · WS-03
#         accepts kind, visibility, commentPolicy, status, scheduledFor, poll, article; server-side mention parse
#  PATCH  /posts/:id
#         phase P4 · WS-03
#         sets editedAt; visibility may only NARROW after publish
#  POST   /messaging/rooms/:id/messages
#         phase P4,P6 · WS-10/WS-12
#         accepts kind, voiceUrl, voiceSeconds, voiceWaveform; runs the scam scanner for non-1st-degree
#  GET    /jobs
#         phase P6 · WS-06
#         facets: occupationKey, governorateKey, reachability, locationMode, payBasis, payMin, verifiedOnly, postedWithin
#  GET    /jobs/:id
#         phase P6 · WS-06
#         adds fitScore, reachabilityBand, company insights, salary insight
#  POST   /jobs/:id/apply
#         phase P6 · WS-06
#         structured body: screening answers, expectedPay, availableFrom, attachedProofIds, portfolioPostIds, documentId; writes matchSnapshot
#  PATCH  /companies/:companyId/jobs/:jobId/applicants/:applicationId
#         phase P6 · WS-06
#         stage moves; RejectionReason REQUIRED on every REJECTED transition; writes ApplicationStageEvent
#  GET    /companies/:companyId/jobs/:jobId/applicants
#         phase P6 · WS-06
#         ranked by matchScore, faceted, paged
#  GET    /search/jobs
#         phase P5 · WS-13
#         INNER JOIN Company -> LEFT JOIN (the defect that hides every company-less job); tsvector relevance
#  GET    /search/people
#         phase P5 · WS-13
#         structured facets replace keyword-only; tsvector + trigram
#  GET    /billing/catalog
#         phase P10 · WS-09
#         ILS-first, platform-aware (no prices in the iOS build), wallet availability
#  POST   /billing/checkout-session
#         phase P10 · WS-09
#         accepts method; returns the discriminated initiate() result
#  GET    /messaging/rooms
#         phase P4 · WS-10
#         three tabs: primary | requests | archived
#  GET    /notifications
#         phase P7 · WS-14
#         rollups: count + actorIds[]
#  GET    /profiles/:handle
#         phase P2,P3 · WS-01/WS-02
#         adds EvidenceSummary, degree, mutualCount, followState, sections, translation

# ── RATE-LIMIT BUCKETS ─────────────────────────────────────────────────────
# @RateLimit("bucket") means ONE shared budget across every handler carrying
# that bucket — that is what BaydarThrottlerGuard.generateKey is for.
#
#  profile-write          60/hour/user
#  recommendation         20/day/user
#  otp-start              3/hour/user AND 5/day/phone
#  otp-confirm            10/hour/user
#  verification-request   5/day/user
#  work-proof             30/day/user
#  vouch                  5/day/user
#  export                 10/day/user
#  signals                200/hour/user
#  outreach               entitlement-gated, not rate-limited
#  promotion-write        30/hour/company
#  search                 120/hour/user
#  inquiry                20/day/user
