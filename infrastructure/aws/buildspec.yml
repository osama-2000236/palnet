version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  build:
    commands:
      - docker build --file apps/api/Dockerfile --tag "$API_IMAGE" .
      - docker build --file apps/web/Dockerfile --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" --tag "$WEB_IMAGE" .
  post_build:
    commands:
      - docker push "$API_IMAGE"
      - docker push "$WEB_IMAGE"
      - printf '{"api":"%s","web":"%s"}' "$API_IMAGE" "$WEB_IMAGE" > images.json
artifacts:
  files:
    - images.json
