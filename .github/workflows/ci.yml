name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  # Dummy values so Zod env validation passes in CI — real secrets live in Render/Vercel.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
  JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"
  CORS_ORIGINS: "http://localhost:3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - run: pnpm lint:tokens
      - run: pnpm lint
      - run: pnpm format:check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: baydar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - run: pnpm --filter @baydar/db db:deploy
      - run: pnpm test
      - run: pnpm --filter @baydar/mobile test

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-
      - run: pnpm turbo run build --filter @baydar/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
          retention-days: 1
          if-no-files-found: error

  e2e-web:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: baydar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - run: pnpm --filter @baydar/db db:deploy
      - run: pnpm turbo run build --filter @baydar/shared --filter @baydar/ui-tokens --filter @baydar/ui-web
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @baydar/web exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @baydar/web exec playwright install-deps chromium
      - name: Download .next build
        uses: actions/download-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
      - name: Start API + Web and run Playwright
        run: pnpm --filter @baydar/web e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS

  lighthouse-web:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Download .next build
        uses: actions/download-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=./apps/web/lighthouserc.json
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
