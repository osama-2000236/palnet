name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.12.0"
  # Dummy values so Zod env validation passes in CI — real secrets live in Render/Vercel.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
  JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"
  CORS_ORIGINS: "http://localhost:3000"
  # Bank rail must be configured for the e2e bank-transfer lifecycle test —
  # the API refuses bank checkouts when unset (by design, no placeholder IBAN).
  BANK_TRANSFER_IBAN: "PS00CI00000000000000000000000"
  BANK_TRANSFER_BENEFICIARY: "Baydar CI"

# There is deliberately no `install` job. One used to sit in front of every
# other job as `needs: install`, but a job's node_modules do not outlive it —
# it installed, generated the Prisma client, threw both away, and the four jobs
# behind it each installed again from scratch. `needs:` was buying sequencing,
# not reuse, and the jobs are independent. They install in parallel now.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:tokens
      - run: pnpm qa:design
      - run: pnpm check:i18n
      - run: pnpm check:ui-lockstep
      - run: pnpm check:release-placeholders
      - run: pnpm check:security-headers

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: baydar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - run: pnpm --filter @baydar/db db:deploy
      - run: pnpm test
      - run: pnpm --filter @baydar/mobile test

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - run: pnpm turbo run build --filter @baydar/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
      # The one web build in this workflow. `e2e-web` and `lighthouse-web` both
      # `needs: build-web` and both used to rebuild it from scratch anyway —
      # three full Next builds per PR to ship one artifact. They download this
      # instead. `.next/cache` is excluded: `next start` never reads it and it
      # is the bulk of the directory.
      - name: Upload built web app
        uses: actions/upload-artifact@v6
        with:
          name: web-build-${{ github.run_id }}
          path: |
            apps/web/.next
            !apps/web/.next/cache
          retention-days: 1
          include-hidden-files: true

  e2e-web:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: baydar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - run: pnpm --filter @baydar/db db:deploy
      - name: Download the web build
        uses: actions/download-artifact@v6
        with:
          name: web-build-${{ github.run_id }}
          path: apps/web/.next
      - run: pnpm --filter @baydar/web exec playwright install --with-deps chromium
      - name: Start API + Web and run Playwright
        run: pnpm --filter @baydar/web e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse-web:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baydar/db db:generate
      - name: Download the web build
        uses: actions/download-artifact@v6
        with:
          name: web-build-${{ github.run_id }}
          path: apps/web/.next
      - name: Lighthouse CI (desktop)
        run: npx --yes @lhci/cli@0.14.x autorun --config=./apps/web/lighthouserc.json
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
      # lighthouserc.mobile.json was maintained but invoked by nothing, so the
      # mobile budget it defines had never been enforced — on an Arabic-first
      # product where most traffic is a phone.
      - name: Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.14.x autorun --config=./apps/web/lighthouserc.mobile.json
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_DEFAULT_LOCALE: ar-PS
