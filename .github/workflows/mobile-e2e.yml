name: mobile-e2e

# Opt-in only. Maestro + Android emulator + EAS preview build is expensive
# and slow; we don't want every PR paying for it. Promote to nightly cron
# once the QA fixture pipeline is rock-solid. Closes #8 in scaffold form.
on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Maestro flow file under apps/mobile/.maestro/ (or 'all')"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ inputs.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_APP_ID: ps.baydar.app

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm-deps

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The expo/expo-github-action workflow already covers `eas build`. For
      # smoke we want a local preview build (no EAS round trip) — keep the
      # job self-contained by reading the build URL from secrets if a CI
      # build is pre-staged, otherwise fail fast with a clear message.
      - name: Verify preview build available
        env:
          PREVIEW_URL: ${{ secrets.MOBILE_PREVIEW_BUILD_URL }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::MOBILE_PREVIEW_BUILD_URL is not set. Run `eas build --platform android --profile preview` and store the URL as a secret."
            exit 1
          fi
          echo "::notice::Using preview build: $PREVIEW_URL"

      - name: Run Maestro smoke flow(s)
        working-directory: apps/mobile
        run: |
          if [ "${{ inputs.flow }}" = "all" ]; then
            maestro test .maestro/
          else
            maestro test ".maestro/${{ inputs.flow }}"
          fi
