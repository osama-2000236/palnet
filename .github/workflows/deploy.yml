name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      submit_mobile:
        description: "Submit mobile builds to EAS (production only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # Cancel in-progress staging deploys when a newer one starts.
  # Production deploys never cancel — first request wins.
  group: deploy-${{ github.ref }}-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: ${{ github.event.inputs.target != 'production' }}

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  # Dummy values so Zod env validation passes during build steps — real secrets live in Render/Vercel.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/baydar_ci?schema=public"
  JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
  JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"
  CORS_ORIGINS: "http://localhost:3000"

jobs:
  gate:
    name: Gate (lint + type-check + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: baydar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - run: pnpm lint:tokens
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm --filter @baydar/db db:deploy
      - run: pnpm test
      - run: pnpm --filter @baydar/mobile test

  migrate-staging:
    name: Migrate Neon (staging)
    needs: gate
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      skip: ${{ steps.precheck.outputs.skip }}
    steps:
      - name: Verify staging DB secret present
        id: precheck
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::warning::STAGING_DATABASE_URL not set — skipping staging migrate. Configure secret to enable. See .github/SECRETS.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.precheck.outputs.skip != 'true'
      - uses: ./.github/actions/setup-pnpm-deps
        if: steps.precheck.outputs.skip != 'true'
        with:
          generate-prisma: "false"
      - name: Run Prisma migrate deploy against staging
        if: steps.precheck.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: pnpm --filter @baydar/db db:deploy

  deploy-api-staging:
    name: Deploy API (staging) — Render
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render staging deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_STAGING_DEPLOY_HOOK not set — skipping. See .github/SECRETS.md."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

  deploy-web-staging:
    name: Deploy Web (staging) — Vercel
    needs: gate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify Vercel secrets present
        id: precheck
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
          P: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          if [ -z "$T" ] || [ -z "$O" ] || [ -z "$P" ]; then
            echo "::warning::Vercel staging secrets missing (need VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_WEB) — skipping. See .github/SECRETS.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.precheck.outputs.skip != 'true'
      - uses: ./.github/actions/setup-pnpm-deps
        if: steps.precheck.outputs.skip != 'true'
      - name: Install Vercel CLI
        if: steps.precheck.outputs.skip != 'true'
        run: npm install -g vercel@latest
      - name: Pull Vercel staging env
        if: steps.precheck.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        working-directory: apps/web
      - name: Build Web (Vercel)
        if: steps.precheck.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"
        working-directory: apps/web
      - name: Deploy Web to staging
        if: steps.precheck.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN" > deploy-url.txt
        working-directory: apps/web

  migrate-production:
    name: Migrate Neon (production)
    needs: [deploy-api-staging, deploy-web-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify production DB secret present
        id: precheck
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL not set — refusing production deploy. See .github/SECRETS.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
        with:
          generate-prisma: "false"
      - name: Run Prisma migrate deploy against production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: pnpm --filter @baydar/db db:deploy

  deploy-api-production:
    name: Deploy API (production) — Render
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_PROD_DEPLOY_HOOK not set. See .github/SECRETS.md."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

  deploy-web-production:
    name: Deploy Web (production) — Vercel
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Vercel production secrets present
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
          P: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          if [ -z "$T" ] || [ -z "$O" ] || [ -z "$P" ]; then
            echo "::error::Vercel production secrets missing. See .github/SECRETS.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: apps/web
      - name: Build Web (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: apps/web
      - name: Deploy Web to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: apps/web

  submit-mobile-production:
    name: Submit Mobile builds (production) — EAS
    needs: deploy-api-production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && github.event.inputs.submit_mobile == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify EAS token present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN not set. See .github/SECRETS.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest
      - name: EAS build + submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform all --profile production --non-interactive --auto-submit
        working-directory: apps/mobile
