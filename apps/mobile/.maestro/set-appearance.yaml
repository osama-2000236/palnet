appId: ps.baydar.app
name: "set appearance (theme + locale)"
tags:
  - qa
# No `env:` defaults here on purpose. Maestro 2.5.0 gives an in-file `env` block
# precedence over `-e` on the command line, so declaring `THEME: light` meant
# every invocation tapped `appearance-light` no matter what the caller asked
# for — and the assertion below passed, because light really was selected. The
# dark cell of the screenshot matrix was never capturable; it produced 38 light
# screenshots named `…__dark.png`. Callers must pass both values.
---
# Drives Settings → Appearance so the screenshot harness can shoot each
# theme/locale cell. Deliberately does NOT clearState: the harness relies on the
# session persisting across the whole run.
#
# Taps by testID, not by label — the labels are translated, so tapping by text
# cannot drive the locale switch itself (you would need to know the current
# locale to find the control that changes it).
# Let the boot redirect finish BEFORE deep-linking. The app always lands on the
# feed after startup; if the deep link goes first that redirect arrives after it
# and silently steals the screen. Waiting for the composer entry is how we know
# boot is done and a deep link will stick.
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-composer-entry"
    timeout: 60000

- openLink: baydar://settings/appearance
- extendedWaitUntil:
    visible:
      id: "appearance-segmented"
    timeout: 30000
- tapOn:
    id: "appearance-${THEME}"
# Wait for the segment to actually report itself selected before moving on.
# `tapOn` completing only means the tap was dispatched; the preference write is
# async (SecureStore), and the `launchApp` further down force-stops the app. A
# whole 38-screen cell was once captured in light and filed under `__dark`
# because the write lost that race and every step still reported COMPLETED.
- extendedWaitUntil:
    visible:
      id: "appearance-${THEME}"
      selected: true
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: "language-segmented"
    timeout: 10000
- tapOn:
    id: "language-${LOCALE}"

# Locale changes that flip writing direction need a reload to take effect
# (I18nManager.forceRTL is applied at startup), so hand the harness a settled app.
- launchApp

# No assertion on what the relaunch lands on. The harness deep-links away
# immediately and waits for the frame to stop changing, so pinning this to the
# feed composer only couples the flow to a screen it does not care about — and
# an RTL flip makes the relaunch slow enough to fail that assertion.

# Dev-only LogBox toast sits over the bottom nav and would appear in every
# screenshot of the run. Dismiss it once per cell; absent in release builds.
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn: "Open debugger to view warnings."
