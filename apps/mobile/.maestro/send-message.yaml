appId: ps.baydar.app
name: "send message"
tags:
  - smoke
---
- runFlow: login-to-feed.yaml

- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "room-list"
    timeout: 5000

# Pick the first room in the list. The QA fixture seeds at least one DM
# with the messaging companion so this is stable across runs.
- tapOn:
    id: "room-list-row-0"

- tapOn:
    id: "message-composer"
- inputText: "Maestro smoke ping"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "messages-send-button"
    timeout: 5000
- tapOn:
    id: "messages-send-button"

- extendedWaitUntil:
    visible:
      text: "Maestro smoke ping"
    timeout: 10000
